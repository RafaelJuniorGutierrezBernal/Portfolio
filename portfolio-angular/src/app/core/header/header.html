<header class="header" [class.header--scrolled]="isScrolled">
  <nav class="nav container--wide" aria-label="Navegación principal">
    <a href="#" class="nav-logo" aria-label="Rafael Junior - Inicio">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--color-primary)"/>
        <path d="M8 8h7c2.76 0 5 2.24 5 5s-2.24 5-5 5h-3v2H8V8zm4 7h3a3 3 0 000-6h-3v6z" fill="var(--color-text-inverse)"/>
        <circle cx="20" cy="20" r="2.5" fill="var(--color-text-inverse)" opacity="0.7"/>
      </svg>
      Rafael Junior
    </a>

    <ul class="nav-links" role="list">
      <li><a href="#about">Sobre mí</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Proyectos</a></li>
      <li><a href="#education">Educación</a></li>
    </ul>

    <div class="nav-right">
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        <svg *ngIf="isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg *ngIf="!isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="#contact" class="btn-nav">Contacto</a>
    </div>

    <button class="hamburger" (click)="toggleMenu()" aria-label="Abrir menú" [attr.aria-expanded]="isMenuOpen">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" [class.open]="isMenuOpen" role="navigation" aria-label="Menú móvil">
    <a href="#about" class="mobile-link" (click)="closeMenu()">Sobre mí</a>
    <a href="#skills" class="mobile-link" (click)="closeMenu()">Skills</a>
    <a href="#projects" class="mobile-link" (click)="closeMenu()">Proyectos</a>
    <a href="#education" class="mobile-link" (click)="closeMenu()">Educación</a>
    <a href="#contact" class="mobile-link" style="color:var(--color-primary);font-weight:700;" (click)="closeMenu()">Contacto</a>
  </div>
</header>
